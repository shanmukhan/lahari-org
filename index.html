<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="description" content="Shanmukhan's Science Lab — animated, interactive science experiments: gravity, eclipses, relativity, atoms, the periodic table and more. Personal site at lahari.org." />
<title>Science Lab — lahari.org</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #07090a; --surface: #101412; --surface-2: #161c19;
    --text: #f5f8f6; --muted: #9fada6; --line: rgba(255,255,255,.09);
    --line-strong: rgba(255,255,255,.17);
    --accent: #34d399; --accent-2: #60a5fa; --accent-3: #f0b849;
    --max: 1100px;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0; font-family: Inter, ui-sans-serif, system-ui, sans-serif;
    background:
      radial-gradient(circle at 10% -5%, rgba(52,211,153,.20), transparent 32%),
      radial-gradient(circle at 95% 5%, rgba(96,165,250,.14), transparent 32%),
      radial-gradient(circle at 50% 100%, rgba(240,184,73,.06), transparent 40%),
      var(--bg);
    color: var(--text); line-height: 1.6;
  }
  a { color: var(--accent-2); text-decoration: none; }
  .container { width: min(calc(100% - 40px), var(--max)); margin: 0 auto; }
  nav { position: sticky; top: 0; z-index: 30; backdrop-filter: blur(18px);
    background: linear-gradient(180deg, rgba(52,211,153,.10), rgba(7,9,10,.88) 78%);
    border-bottom: 1px solid var(--line); }
  .nav-inner { height: 66px; display: flex; align-items: center; justify-content: space-between; }
  .brand { display: flex; align-items: center; gap: 9px; font-family: "Space Grotesk", Inter, sans-serif;
    font-weight: 700; letter-spacing: -.02em; font-size: 1.05rem; color: var(--text); }
  .brand-mark { width: 20px; height: 20px; border-radius: 6px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    box-shadow: 0 0 14px rgba(52,211,153,.55); flex: none; }
  .nav-links { display: flex; align-items: center; gap: 22px; }
  .nav-links a:not(.nav-cta) { color: var(--muted); font-size: .9rem; }
  .nav-links a:not(.nav-cta):hover { color: var(--text); }
  .nav-cta { display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px;
    border-radius: 999px; border: 1px solid var(--line-strong); color: var(--text) !important;
    font-size: .82rem; font-weight: 600; }
  header.hero { padding: 22px 0 10px; text-align: center; }
  h1 { font-family: "Space Grotesk", Inter, sans-serif; font-size: clamp(1.5rem, 3.6vw, 2.1rem);
    margin: 0 0 6px; letter-spacing: -.03em; }
  header.hero p { color: var(--muted); max-width: 620px; margin: 0 auto; font-size: .95rem; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; padding: 16px 0 60px; }
  .card {
    display: block; padding: 26px; border-radius: 20px; background: var(--surface);
    border: 1px solid var(--line); transition: transform .2s ease, border-color .2s ease, box-shadow .2s ease;
  }
  .card:hover { transform: translateY(-4px); border-color: var(--accent); box-shadow: 0 16px 34px -14px rgba(52,211,153,.35); }
  .card .icon { width: 54px; height: 54px; display: grid; place-items: center; border-radius: 14px;
    background: rgba(255,255,255,.06); font-size: 1.9rem; margin-bottom: 16px; }
  .card h3 { margin: 0 0 6px; font-size: 1.2rem; color: var(--text); }
  .card p { margin: 0; color: var(--muted); font-size: .9rem; line-height: 1.5; }
  .tag { display: inline-block; margin-top: 14px; font-size: .74rem; color: var(--accent);
    font-weight: 700; text-transform: uppercase; letter-spacing: .05em; }
  footer { padding: 30px 0 50px; border-top: 1px solid var(--line); color: var(--muted); font-size: .88rem; text-align: center; }
  @media (max-width: 900px) { .grid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 700px) { .nav-links a:not(.nav-cta) { display: none; } }
  @media (max-width: 600px) { .grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<nav>
  <div class="container nav-inner">
    <a class="brand" href="index.html"><span class="brand-mark"></span>Shanmukhan</a>
    <div class="nav-links">
      <a href="play.html">Play</a>
      <a class="nav-cta" href="https://shanmukhan.com/" target="_blank" rel="noopener">See my products →</a>
    </div>
  </div>
</nav>

<header class="hero">
  <div class="container">
    <h1>🔬 Science Lab</h1>
    <p>Animated, interactive explainers for the biggest ideas in science — built for curious minds of any age. Pick a topic below.</p>
  </div>
</header>

<div class="container">
  <div class="grid" id="grid"></div>
</div>

<footer>
  <div class="container">© <span id="year"></span> Shanmukhan · Hosted at home on a Raspberry Pi · <a href="play.html">Play some games</a></div>
</footer>

<script>
document.getElementById('year').textContent = new Date().getFullYear();

const CATEGORIES = [
  {href:'category-space.html', icon:'🌌', title:'Space & Universe', desc:'Gravity, eclipses, black holes, tides, seasons, and the Big Bang.', count:8},
  {href:'category-physics.html', icon:'🌀', title:'Physics in Action', desc:'String theory, relativity, time dilation, rainbows, rockets, and sound.', count:9},
  {href:'category-atoms.html', icon:'⚛️', title:'Atoms & Matter', desc:'What\'s inside an atom, hydrogen vs helium, the periodic table, and states of matter.', count:5},
  {href:'category-tech.html', icon:'🔧', title:'Everyday Tech', desc:'How the machines and gadgets around you actually work.', count:5},
  {href:'category-life.html', icon:'🧬', title:'Life Science', desc:'Biology and the living world — more experiments coming soon.', count:0},
  {href:'category-math.html', icon:'➗', title:'Math Made Simple', desc:'Calculus, probability, and other math ideas explained visually.', count:0},
];

const grid = document.getElementById('grid');
CATEGORIES.forEach(c => {
  const a = document.createElement('a');
  a.className = 'card';
  a.href = c.href;
  const countLabel = c.count === 0 ? 'Coming soon' : c.count + ' experiment' + (c.count === 1 ? '' : 's');
  a.innerHTML = `<div class="icon">${c.icon}</div><h3>${c.title}</h3><p>${c.desc}</p><span class="tag">${countLabel} →</span>`;
  grid.appendChild(a);
});
</script>
</body>
</html>
