<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="description" content="Shanmukhan's Science Lab — animated, interactive science experiments: gravity, eclipses, relativity, atoms, the periodic table and more. Personal site at lahari.org." />
<title>Science Lab — lahari.org</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #07090a; --surface: #101412; --surface-2: #161c19;
    --text: #f5f8f6; --muted: #9fada6; --line: rgba(255,255,255,.09);
    --line-strong: rgba(255,255,255,.17);
    --accent: #34d399; --accent-2: #60a5fa; --accent-3: #f0b849;
    --max: 1100px;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0; font-family: Inter, ui-sans-serif, system-ui, sans-serif;
    background:
      radial-gradient(circle at 10% -5%, rgba(52,211,153,.20), transparent 32%),
      radial-gradient(circle at 95% 5%, rgba(96,165,250,.14), transparent 32%),
      radial-gradient(circle at 50% 100%, rgba(240,184,73,.06), transparent 40%),
      var(--bg);
    color: var(--text); line-height: 1.6;
  }
  a { color: var(--accent-2); text-decoration: none; }
  .container { width: min(calc(100% - 40px), var(--max)); margin: 0 auto; }
  nav { position: sticky; top: 0; z-index: 30; backdrop-filter: blur(18px);
    background: linear-gradient(180deg, rgba(52,211,153,.10), rgba(7,9,10,.88) 78%);
    border-bottom: 1px solid var(--line); }
  .nav-inner { height: 66px; display: flex; align-items: center; justify-content: space-between; }
  .brand { display: flex; align-items: center; gap: 9px; font-family: "Space Grotesk", Inter, sans-serif;
    font-weight: 700; letter-spacing: -.02em; font-size: 1.05rem; color: var(--text); }
  .brand-mark { width: 20px; height: 20px; border-radius: 6px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    box-shadow: 0 0 14px rgba(52,211,153,.55); flex: none; }
  .nav-links { display: flex; align-items: center; gap: 22px; }
  .nav-links a:not(.nav-cta) { color: var(--muted); font-size: .9rem; }
  .nav-links a:not(.nav-cta):hover { color: var(--text); }
  .nav-cta { display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px;
    border-radius: 999px; border: 1px solid var(--line-strong); color: var(--text) !important;
    font-size: .82rem; font-weight: 600; }
  .lang-toggle { display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px;
    border-radius: 999px; border: 1px solid var(--line-strong); background: transparent;
    color: var(--text); font-size: .82rem; font-weight: 600; font-family: inherit;
    cursor: pointer; transition: border-color .2s ease, background .2s ease; }
  .lang-toggle:hover { border-color: var(--accent); background: rgba(52,211,153,.10); }
  header.hero { padding: 22px 0 10px; text-align: center; }
  h1 { font-family: "Space Grotesk", Inter, sans-serif; font-size: clamp(1.5rem, 3.6vw, 2.1rem);
    margin: 0 0 6px; letter-spacing: -.03em; }
  header.hero p { color: var(--muted); max-width: 620px; margin: 0 auto; font-size: .95rem; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; padding: 16px 0 60px; }
  .card {
    display: block; padding: 26px; border-radius: 20px; background: var(--surface);
    border: 1px solid var(--line); transition: transform .2s ease, border-color .2s ease, box-shadow .2s ease;
  }
  .card:hover { transform: translateY(-4px); border-color: var(--accent); box-shadow: 0 16px 34px -14px rgba(52,211,153,.35); }
  .card .icon { width: 54px; height: 54px; display: grid; place-items: center; border-radius: 14px;
    background: rgba(255,255,255,.06); font-size: 1.9rem; margin-bottom: 16px; }
  .card h3 { margin: 0 0 6px; font-size: 1.2rem; color: var(--text); }
  .card p { margin: 0; color: var(--muted); font-size: .9rem; line-height: 1.5; }
  .tag { display: inline-block; margin-top: 14px; font-size: .74rem; color: var(--accent);
    font-weight: 700; text-transform: uppercase; letter-spacing: .05em; }
  footer { padding: 30px 0 50px; border-top: 1px solid var(--line); color: var(--muted); font-size: .88rem; text-align: center; }
  @media (max-width: 900px) { .grid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 700px) { .nav-links a:not(.nav-cta) { display: none; } }
  @media (max-width: 600px) { .grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<nav>
  <div class="container nav-inner">
    <a class="brand" href="index.html"><span class="brand-mark"></span>Shanmukhan</a>
    <div class="nav-links">
      <a href="play.html" id="navPlay">Play</a>
      <a class="nav-cta" href="https://shanmukhan.com/" target="_blank" rel="noopener" id="navCta">See my products →</a>
      <button class="lang-toggle" id="langToggle">తెలుగు</button>
    </div>
  </div>
</nav>

<header class="hero">
  <div class="container">
    <h1 id="heroTitle">🔬 Science Lab</h1>
    <p id="heroDesc">Animated, interactive explainers for the biggest ideas in science — built for curious minds of any age. Pick a topic below.</p>
  </div>
</header>

<div class="container">
  <div class="grid" id="grid"></div>
</div>

<footer>
  <div class="container">© <span id="year"></span> <span id="footerText">Shanmukhan · Hosted at home on a Raspberry Pi · </span><a href="play.html" id="footerPlayLink">Play some games</a></div>
</footer>

<script>
document.getElementById('year').textContent = new Date().getFullYear();

let LANG = 'en';

const T = {
  en: {
    navPlay: 'Play',
    navCta: 'See my products →',
    heroTitle: '🔬 Science Lab',
    heroDesc: 'Animated, interactive explainers for the biggest ideas in science — built for curious minds of any age. Pick a topic below.',
    footerText: 'Shanmukhan · Hosted at home on a Raspberry Pi · ',
    footerPlayLink: 'Play some games',
    comingSoon: 'Coming soon',
    experiment: 'experiment',
    experiments: 'experiments',
  },
  te: {
    navPlay: 'ఆటలు',
    navCta: 'నా ఉత్పత్తులు చూడండి →',
    heroTitle: '🔬 సైన్స్ ల్యాబ్',
    heroDesc: 'సైన్స్‌లోని గొప్ప ఆలోచనలను వివరించే యానిమేటెడ్, ఇంటరాక్టివ్ పాఠాలు — ఏ వయసు వారికైనా ఆసక్తికరంగా ఉంటాయి. కింద ఒక అంశాన్ని ఎంచుకోండి.',
    footerText: 'శన్ముఖన్ · ఇంటి వద్ద Raspberry Pi పై హోస్ట్ చేయబడింది · ',
    footerPlayLink: 'కొన్ని ఆటలు ఆడండి',
    comingSoon: 'త్వరలో వస్తుంది',
    experiment: 'ప్రయోగం',
    experiments: 'ప్రయోగాలు',
  }
};

function tr() { return T[LANG]; }

const CATEGORIES = [
  {href:'category-space.html', icon:'🌌', count:8,
    title:{en:'Space & Universe', te:'అంతరిక్షం & విశ్వం'},
    desc:{en:'Gravity, eclipses, black holes, tides, seasons, and the Big Bang.', te:'గురుత్వాకర్షణ, గ్రహణాలు, కృష్ణ బిలాలు, ఆటుపోట్లు, ఋతువులు, మరియు బిగ్ బ్యాంగ్.'}},
  {href:'category-physics.html', icon:'🌀', count:14,
    title:{en:'Physics in Action', te:'చలనశీలంలో భౌతికశాస్త్రం'},
    desc:{en:'String theory, relativity, rainbows, rockets, sound, and electromagnetic induction.', te:'స్ట్రింగ్ థియరీ, సాపేక్షతా సిద్ధాంతం, హరివిల్లులు, రాకెట్లు, ధ్వని, మరియు విద్యుదయస్కాంత ప్రేరణ.'}},
  {href:'category-atoms.html', icon:'⚛️', count:7,
    title:{en:'Atoms & Matter', te:'పరమాణువులు & పదార్థం'},
    desc:{en:'What\'s inside an atom, the periodic table, states of matter, and the pH scale.', te:'పరమాణువు లోపల ఏముంది, ఆవర్తన పట్టిక, పదార్థ స్థితులు, మరియు pH స్కేల్.'}},
  {href:'category-tech.html', icon:'🔧', count:9,
    title:{en:'Everyday Tech', te:'నిత్యజీవిత సాంకేతికత'},
    desc:{en:'Motors, batteries, magnets, screens, Wi-Fi, flight, diodes, transistors, and circuits.', te:'మోటార్లు, బ్యాటరీలు, అయస్కాంతాలు, స్క్రీన్‌లు, Wi-Fi, విమానయానం, డయోడ్‌లు, ట్రాన్సిస్టర్‌లు, మరియు సర్క్యూట్‌లు.'}},
  {href:'category-life.html', icon:'🧬', count:6,
    title:{en:'Life Science', te:'జీవశాస్త్రం'},
    desc:{en:'Photosynthesis, vaccines, DNA, DNA replication, cell division, and how your eye works.', te:'కిరణజన్య సంయోగక్రియ, వ్యాక్సిన్‌లు, DNA, DNA ప్రతిరూపణ, కణ విభజన, మరియు కన్ను ఎలా పనిచేస్తుంది.'}},
  {href:'category-math.html', icon:'➗', count:3,
    title:{en:'Math Made Simple', te:'సులభమైన గణితం'},
    desc:{en:'Calculus, derivatives, integrals, and probability, explained visually.', te:'కలన గణితం, అవకలనాలు, సమాకలనాలు, మరియు సంభావ్యత — చిత్రాల ద్వారా వివరణ.'}},
  {href:'category-indian-scientists.html', icon:'🇮🇳', count:6,
    title:{en:'Indian Scientists', te:'భారతీయ శాస్త్రవేత్తలు'},
    desc:{en:'From ancient surgery to Nobel-winning physics — the people behind the discoveries.', te:'ప్రాచీన శస్త్రచికిత్స నుండి నోబెల్ బహుమతి పొందిన భౌతికశాస్త్రం వరకు — ఆవిష్కరణల వెనుక ఉన్న వ్యక్తులు.'}},
];

const grid = document.getElementById('grid');

function renderGrid() {
  grid.innerHTML = '';
  CATEGORIES.forEach(c => {
    const a = document.createElement('a');
    a.className = 'card';
    a.href = c.href;
    const countLabel = c.count === 0 ? tr().comingSoon : c.count + ' ' + (c.count === 1 ? tr().experiment : tr().experiments);
    a.innerHTML = `<div class="icon">${c.icon}</div><h3>${c.title[LANG]}</h3><p>${c.desc[LANG]}</p><span class="tag">${countLabel} →</span>`;
    grid.appendChild(a);
  });
}

function applyStaticText() {
  const t = tr();
  document.getElementById('navPlay').textContent = t.navPlay;
  document.getElementById('navCta').textContent = t.navCta;
  document.getElementById('heroTitle').textContent = t.heroTitle;
  document.getElementById('heroDesc').textContent = t.heroDesc;
  document.getElementById('footerText').textContent = t.footerText;
  document.getElementById('footerPlayLink').textContent = t.footerPlayLink;
  document.getElementById('langToggle').textContent = LANG === 'en' ? 'తెలుగు' : 'English';
  renderGrid();
}

document.getElementById('langToggle').addEventListener('click', () => {
  LANG = LANG === 'en' ? 'te' : 'en';
  applyStaticText();
});

applyStaticText();
</script>
</body>
</html>
