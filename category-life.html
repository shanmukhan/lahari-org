<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="description" content="Life Science — biology and the living world. More experiments coming soon." />
<title>Life Science — Science Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #07090a; --surface: #101412; --surface-2: #161c19;
    --text: #f5f8f6; --muted: #9fada6; --line: rgba(255,255,255,.09);
    --line-strong: rgba(255,255,255,.17);
    --accent: #34d399; --accent-2: #60a5fa; --accent-3: #f0b849;
    --max: 1100px;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0; font-family: Inter, ui-sans-serif, system-ui, sans-serif;
    background:
      radial-gradient(circle at 10% -5%, rgba(52,211,153,.20), transparent 32%),
      radial-gradient(circle at 95% 5%, rgba(96,165,250,.14), transparent 32%),
      radial-gradient(circle at 50% 100%, rgba(240,184,73,.06), transparent 40%),
      var(--bg);
    color: var(--text); line-height: 1.6;
  }
  a { color: var(--accent-2); text-decoration: none; }
  .container { width: min(calc(100% - 40px), var(--max)); margin: 0 auto; }
  nav { position: sticky; top: 0; z-index: 30; backdrop-filter: blur(18px);
    background: linear-gradient(180deg, rgba(52,211,153,.10), rgba(7,9,10,.88) 78%);
    border-bottom: 1px solid var(--line); }
  .nav-inner { height: 66px; display: flex; align-items: center; justify-content: space-between; }
  .brand { display: flex; align-items: center; gap: 9px; font-family: "Space Grotesk", Inter, sans-serif;
    font-weight: 700; letter-spacing: -.02em; font-size: 1.05rem; color: var(--text); }
  .brand-mark { width: 20px; height: 20px; border-radius: 6px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    box-shadow: 0 0 14px rgba(52,211,153,.55); flex: none; }
  .nav-links { display: flex; align-items: center; gap: 22px; }
  .nav-links a:not(.nav-cta) { color: var(--muted); font-size: .9rem; }
  .nav-links a:not(.nav-cta):hover { color: var(--text); }
  .nav-cta { display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px;
    border-radius: 999px; border: 1px solid var(--line-strong); color: var(--text) !important;
    font-size: .82rem; font-weight: 600; }
  .lang-toggle { display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px;
    border-radius: 999px; border: 1px solid var(--line-strong); background: transparent;
    color: var(--text); font-size: .82rem; font-weight: 600; font-family: inherit;
    cursor: pointer; transition: border-color .2s ease, background .2s ease; }
  .lang-toggle:hover { border-color: var(--accent); background: rgba(52,211,153,.10); }
  header.hero { padding: 22px 0 10px; text-align: center; }
  h1 { font-family: "Space Grotesk", Inter, sans-serif; font-size: clamp(1.5rem, 3.6vw, 2.1rem);
    margin: 0 0 6px; letter-spacing: -.03em; }
  header.hero p { color: var(--muted); max-width: 620px; margin: 0 auto; font-size: .95rem; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; padding: 16px 0 60px; }
  .card {
    display: block; padding: 22px; border-radius: 20px; background: var(--surface);
    border: 1px solid var(--line); transition: transform .2s ease, border-color .2s ease, box-shadow .2s ease;
  }
  .card:hover { transform: translateY(-4px); border-color: var(--accent); box-shadow: 0 16px 34px -14px rgba(52,211,153,.35); }
  .card .icon { width: 46px; height: 46px; display: grid; place-items: center; border-radius: 12px;
    background: rgba(255,255,255,.06); font-size: 1.5rem; margin-bottom: 14px; }
  .card h3 { margin: 0 0 6px; font-size: 1.08rem; color: var(--text); }
  .card p { margin: 0; color: var(--muted); font-size: .88rem; line-height: 1.5; }
  .tag { display: inline-block; margin-top: 12px; font-size: .74rem; color: var(--accent);
    font-weight: 700; text-transform: uppercase; letter-spacing: .05em; }
  footer { padding: 30px 0 50px; border-top: 1px solid var(--line); color: var(--muted); font-size: .88rem; text-align: center; }
  @media (max-width: 900px) { .grid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 700px) { .nav-links a:not(.nav-cta) { display: none; } }
  @media (max-width: 600px) { .grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<nav>
  <div class="container nav-inner">
    <a class="brand" href="index.html"><span class="brand-mark"></span>Shanmukhan</a>
    <div class="nav-links">
      <a href="index.html" id="navHome">&larr; Science Lab</a>
      <a href="play.html" id="navPlay">Play</a>
      <a class="nav-cta" href="https://shanmukhan.com/" target="_blank" rel="noopener" id="navCta">See my products →</a>
      <button class="lang-toggle" id="langToggle">తెలుగు</button>
    </div>
  </div>
</nav>

<header class="hero">
  <div class="container">
    <h1 id="heroTitle">🧬 Life Science</h1>
    <p id="heroDesc">Biology and the living world.</p>
  </div>
</header>

<div class="container">
  <div class="grid" id="grid"></div>
</div>

<footer>
  <div class="container">© <span id="year"></span> <span id="footerText">Shanmukhan · Hosted at home on a Raspberry Pi · </span><a href="index.html" id="footerBackLink">Back to Science Lab</a></div>
</footer>

<script>
document.getElementById('year').textContent = new Date().getFullYear();

let LANG = 'en';

const T = {
  en: {
    navHome: '← Science Lab',
    navPlay: 'Play',
    navCta: 'See my products →',
    heroTitle: '🧬 Life Science',
    heroDesc: 'Biology and the living world.',
    footerText: 'Shanmukhan · Hosted at home on a Raspberry Pi · ',
    footerBackLink: 'Back to Science Lab',
    openExperiment: 'Open experiment →',
  },
  te: {
    navHome: '← సైన్స్ ల్యాబ్',
    navPlay: 'ఆటలు',
    navCta: 'నా ఉత్పత్తులు చూడండి →',
    heroTitle: '🧬 జీవశాస్త్రం',
    heroDesc: 'జీవశాస్త్రం మరియు జీవ ప్రపంచం.',
    footerText: 'శన్ముఖన్ · ఇంటి వద్ద Raspberry Pi పై హోస్ట్ చేయబడింది · ',
    footerBackLink: 'సైన్స్ ల్యాబ్‌కు తిరిగి వెళ్ళండి',
    openExperiment: 'ప్రయోగం తెరవండి →',
  }
};

function tr() { return T[LANG]; }

const TOPICS = [
  {href:'photosynthesis-experiment.html', icon:'🌱',
    title:{en:'How Photosynthesis Works', te:'కిరణజన్య సంయోగక్రియ ఎలా పనిచేస్తుంది'},
    desc:{en:'Plants build their own food out of sunlight, air, and water.', te:'మొక్కలు సూర్యకాంతి, గాలి, నీటి నుండి తమ ఆహారాన్ని తయారు చేసుకుంటాయి.'}},
  {href:'vaccine-experiment.html', icon:'💉',
    title:{en:'How Vaccines Work', te:'వ్యాక్సిన్‌లు ఎలా పనిచేస్తాయి'},
    desc:{en:'A safe preview of a germ, so your immune system is ready for the real thing.', te:'ఒక సూక్ష్మజీవి యొక్క సురక్షితమైన పరిచయం, తద్వారా మీ రోగనిరోధక వ్యవస్థ అసలైన దానికి సిద్ధంగా ఉంటుంది.'}},
  {href:'dna-experiment.html', icon:'🧬',
    title:{en:'What Is DNA?', te:'DNA అంటే ఏమిటి?'},
    desc:{en:'The twisted ladder of instructions packed inside nearly every cell in your body.', te:'మీ శరీరంలోని దాదాపు ప్రతి కణంలో నిక్షిప్తమైన సూచనల మెలికలు తిరిగిన నిచ్చెన.'}},
  {href:'cell-division-experiment.html', icon:'🔬',
    title:{en:'Cell Division: Mitosis & Meiosis', te:'కణ విభజన: మైటోసిస్ & మియోసిస్'},
    desc:{en:'How one cell splits into identical copies, or into sperm/egg cells with half the DNA.', te:'ఒక కణం ఒకేలాంటి కాపీలుగా, లేదా సగం DNAతో శుక్ర/అండ కణాలుగా ఎలా విడిపోతుంది.'}},
  {href:'human-eye-experiment.html', icon:'👁️',
    title:{en:'How Your Eye Works', te:'మీ కన్ను ఎలా పనిచేస్తుంది'},
    desc:{en:'A built-in camera — pupil, lens, retina, and a brain that flips the image right-side up.', te:'అంతర్నిర్మిత కెమెరా — పాప, కటకం, రెటీనా, మరియు చిత్రాన్ని సరిచేసే మెదడు.'}},
  {href:'dna-replication-experiment.html', icon:'🧬',
    title:{en:'How DNA Copies Itself', te:'DNA తనను తాను ఎలా కాపీ చేసుకుంటుంది'},
    desc:{en:'The unzip-and-rebuild process every cell performs before it divides.', te:'కణం విభజన చెందేముందు జరిపే విప్పి-మళ్లీ నిర్మించే ప్రక్రియ.'}},
];

const grid = document.getElementById('grid');

function renderGrid() {
  grid.innerHTML = '';
  TOPICS.forEach(t => {
    const a = document.createElement('a');
    a.className = 'card';
    a.href = t.href;
    a.innerHTML = `<div class="icon">${t.icon}</div><h3>${t.title[LANG]}</h3><p>${t.desc[LANG]}</p><span class="tag">${tr().openExperiment}</span>`;
    grid.appendChild(a);
  });
}

function applyStaticText() {
  const t = tr();
  document.getElementById('navHome').textContent = t.navHome;
  document.getElementById('navPlay').textContent = t.navPlay;
  document.getElementById('navCta').textContent = t.navCta;
  document.getElementById('heroTitle').textContent = t.heroTitle;
  document.getElementById('heroDesc').textContent = t.heroDesc;
  document.getElementById('footerText').textContent = t.footerText;
  document.getElementById('footerBackLink').textContent = t.footerBackLink;
  document.getElementById('langToggle').textContent = LANG === 'en' ? 'తెలుగు' : 'English';
  renderGrid();
}

document.getElementById('langToggle').addEventListener('click', () => {
  LANG = LANG === 'en' ? 'te' : 'en';
  applyStaticText();
});

applyStaticText();
</script>
</body>
</html>
