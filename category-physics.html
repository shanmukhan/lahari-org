<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="description" content="Physics in Action — string theory, special relativity, and time dilation." />
<title>Physics in Action — Science Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #07090a; --surface: #101412; --surface-2: #161c19;
    --text: #f5f8f6; --muted: #9fada6; --line: rgba(255,255,255,.09);
    --line-strong: rgba(255,255,255,.17);
    --accent: #34d399; --accent-2: #60a5fa; --accent-3: #f0b849;
    --max: 1100px;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body {
    margin: 0; font-family: Inter, ui-sans-serif, system-ui, sans-serif;
    background:
      radial-gradient(circle at 10% -5%, rgba(52,211,153,.20), transparent 32%),
      radial-gradient(circle at 95% 5%, rgba(96,165,250,.14), transparent 32%),
      radial-gradient(circle at 50% 100%, rgba(240,184,73,.06), transparent 40%),
      var(--bg);
    color: var(--text); line-height: 1.6;
  }
  a { color: var(--accent-2); text-decoration: none; }
  .container { width: min(calc(100% - 40px), var(--max)); margin: 0 auto; }
  nav { position: sticky; top: 0; z-index: 30; backdrop-filter: blur(18px);
    background: linear-gradient(180deg, rgba(52,211,153,.10), rgba(7,9,10,.88) 78%);
    border-bottom: 1px solid var(--line); }
  .nav-inner { height: 66px; display: flex; align-items: center; justify-content: space-between; }
  .brand { display: flex; align-items: center; gap: 9px; font-family: "Space Grotesk", Inter, sans-serif;
    font-weight: 700; letter-spacing: -.02em; font-size: 1.05rem; color: var(--text); }
  .brand-mark { width: 20px; height: 20px; border-radius: 6px;
    background: linear-gradient(135deg, var(--accent), var(--accent-2));
    box-shadow: 0 0 14px rgba(52,211,153,.55); flex: none; }
  .nav-links { display: flex; align-items: center; gap: 22px; }
  .nav-links a:not(.nav-cta) { color: var(--muted); font-size: .9rem; }
  .nav-links a:not(.nav-cta):hover { color: var(--text); }
  .nav-cta { display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px;
    border-radius: 999px; border: 1px solid var(--line-strong); color: var(--text) !important;
    font-size: .82rem; font-weight: 600; }
  .lang-toggle { display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px;
    border-radius: 999px; border: 1px solid var(--line-strong); background: transparent;
    color: var(--text); font-size: .82rem; font-weight: 600; font-family: inherit;
    cursor: pointer; transition: border-color .2s ease, background .2s ease; }
  .lang-toggle:hover { border-color: var(--accent); background: rgba(52,211,153,.10); }
  header.hero { padding: 22px 0 10px; text-align: center; }
  h1 { font-family: "Space Grotesk", Inter, sans-serif; font-size: clamp(1.5rem, 3.6vw, 2.1rem);
    margin: 0 0 6px; letter-spacing: -.03em; }
  header.hero p { color: var(--muted); max-width: 620px; margin: 0 auto; font-size: .95rem; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 18px; padding: 16px 0 60px; }
  .card {
    display: block; padding: 22px; border-radius: 20px; background: var(--surface);
    border: 1px solid var(--line); transition: transform .2s ease, border-color .2s ease, box-shadow .2s ease;
  }
  .card:hover { transform: translateY(-4px); border-color: var(--accent); box-shadow: 0 16px 34px -14px rgba(52,211,153,.35); }
  .card .icon { width: 46px; height: 46px; display: grid; place-items: center; border-radius: 12px;
    background: rgba(255,255,255,.06); font-size: 1.5rem; margin-bottom: 14px; }
  .card h3 { margin: 0 0 6px; font-size: 1.08rem; color: var(--text); }
  .card p { margin: 0; color: var(--muted); font-size: .88rem; line-height: 1.5; }
  .tag { display: inline-block; margin-top: 12px; font-size: .74rem; color: var(--accent);
    font-weight: 700; text-transform: uppercase; letter-spacing: .05em; }
  footer { padding: 30px 0 50px; border-top: 1px solid var(--line); color: var(--muted); font-size: .88rem; text-align: center; }
  @media (max-width: 900px) { .grid { grid-template-columns: repeat(2, 1fr); } }
  @media (max-width: 700px) { .nav-links a:not(.nav-cta) { display: none; } }
  @media (max-width: 600px) { .grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>

<nav>
  <div class="container nav-inner">
    <a class="brand" href="index.html"><span class="brand-mark"></span>Shanmukhan</a>
    <div class="nav-links">
      <a href="index.html" id="navHome">&larr; Science Lab</a>
      <a href="play.html" id="navPlay">Play</a>
      <a class="nav-cta" href="https://shanmukhan.com/" target="_blank" rel="noopener" id="navCta">See my products →</a>
      <button class="lang-toggle" id="langToggle">తెలుగు</button>
    </div>
  </div>
</nav>

<header class="hero">
  <div class="container">
    <h1 id="heroTitle">🌀 Physics in Action</h1>
    <p id="heroDesc">The mind-bending stuff: tiny vibrating strings, why light's speed breaks the rules, and time itself slowing down.</p>
  </div>
</header>

<div class="container">
  <div class="grid" id="grid"></div>
</div>

<footer>
  <div class="container">© <span id="year"></span> <span id="footerText">Shanmukhan · Hosted at home on a Raspberry Pi · </span><a href="index.html" id="footerBackLink">Back to Science Lab</a></div>
</footer>

<script>
document.getElementById('year').textContent = new Date().getFullYear();

let LANG = 'en';

const T = {
  en: {
    navHome: '← Science Lab',
    navPlay: 'Play',
    navCta: 'See my products →',
    heroTitle: '🌀 Physics in Action',
    heroDesc: "The mind-bending stuff: tiny vibrating strings, why light's speed breaks the rules, and time itself slowing down.",
    footerText: 'Shanmukhan · Hosted at home on a Raspberry Pi · ',
    footerBackLink: 'Back to Science Lab',
    openExperiment: 'Open experiment →',
  },
  te: {
    navHome: '← సైన్స్ ల్యాబ్',
    navPlay: 'ఆటలు',
    navCta: 'నా ఉత్పత్తులు చూడండి →',
    heroTitle: '🌀 చలనశీలంలో భౌతికశాస్త్రం',
    heroDesc: 'మెదడుకు పదును పెట్టే విషయాలు: సూక్ష్మంగా కంపించే తీగలు, కాంతి వేగం నియమాలను ఎందుకు ఛేదిస్తుంది, మరియు కాలం స్వయంగా నెమ్మదించడం.',
    footerText: 'శన్ముఖన్ · ఇంటి వద్ద Raspberry Pi పై హోస్ట్ చేయబడింది · ',
    footerBackLink: 'సైన్స్ ల్యాబ్‌కు తిరిగి వెళ్ళండి',
    openExperiment: 'ప్రయోగం తెరవండి →',
  }
};

function tr() { return T[LANG]; }

const TOPICS = [
  {href:'string-theory-experiment.html', icon:'🎻',
    title:{en:'String Theory, Simply', te:'స్ట్రింగ్ థియరీ, సులభంగా'},
    desc:{en:'What if every particle is really a tiny vibrating string, like a guitar string?', te:'ప్రతి కణం నిజానికి గిటార్ తీగలా కంపించే ఒక సూక్ష్మమైన తీగ అయితే?'}},
  {href:'special-relativity-experiment.html', icon:'🚀',
    title:{en:'Special Relativity', te:'ప్రత్యేక సాపేక్షతా సిద్ధాంతం'},
    desc:{en:"Why light's constant speed forces space and time to bend instead.", te:'కాంతి వేగం స్థిరంగా ఉండటం వల్ల స్థలం మరియు కాలం ఎందుకు వంగుతాయి.'}},
  {href:'time-dilation-experiment.html', icon:'⏳',
    title:{en:'Time Slows Down at Speed', te:'వేగంతో కాలం నెమ్మదిస్తుంది'},
    desc:{en:'The light-clock thought experiment behind the famous twin paradox.', te:'ప్రసిద్ధ జంట వైరుధ్యం (twin paradox) వెనుక ఉన్న కాంతి-గడియారం ఆలోచనా ప్రయోగం.'}},
  {href:'rainbow-experiment.html', icon:'🌈',
    title:{en:'How Rainbows Form', te:'హరివిల్లులు ఎలా ఏర్పడతాయి'},
    desc:{en:'White sunlight secretly contains every color — raindrops split it apart.', te:'తెల్లని సూర్యకాంతిలో అన్ని రంగులు దాగి ఉంటాయి — వర్షపు బిందువులు వాటిని వేరు చేస్తాయి.'}},
  {href:'sky-blue-experiment.html', icon:'🌤️',
    title:{en:'Why the Sky Is Blue', te:'ఆకాశం నీలంగా ఎందుకు ఉంటుంది'},
    desc:{en:'Why blue light scatters everywhere overhead, and sunsets turn red.', te:'నీలి కాంతి ఆకాశమంతా ఎందుకు చెదరిపోతుంది, సూర్యాస్తమయాలు ఎరుపుగా ఎందుకు మారతాయి.'}},
  {href:'double-slit-experiment.html', icon:'🎯',
    title:{en:'The Double-Slit Experiment', te:'డబుల్-స్లిట్ ప్రయోగం'},
    desc:{en:'Light plays a trick on us — the famous experiment behind quantum weirdness.', te:'కాంతి మనతో ఒక ఆట ఆడుతుంది — క్వాంటం విచిత్రాల వెనుక ఉన్న ప్రసిద్ధ ప్రయోగం.'}},
  {href:'rocket-experiment.html', icon:'🚀',
    title:{en:'How Rockets Work', te:'రాకెట్లు ఎలా పనిచేస్తాయి'},
    desc:{en:"No wings, no wheels — just Newton's third law blasting gas one way and the rocket the other.", te:'రెక్కలు లేవు, చక్రాలు లేవు — న్యూటన్ మూడవ నియమం ప్రకారం వాయువును ఒక వైపు, రాకెట్‌ను మరో వైపు నెడుతుంది.'}},
  {href:'newtons_three_laws_animated.html', icon:'🏈',
    title:{en:"Newton's Three Laws of Motion", te:'న్యూటన్ చలన నియమాలు మూడు'},
    desc:{en:'Why footballs stop, bicycles speed up, and rockets move — all three laws, animated.', te:'ఫుట్‌బాల్ ఎందుకు ఆగుతుంది, సైకిల్ ఎందుకు వేగం పుంజుకుంటుంది, రాకెట్ ఎందుకు కదులుతుంది — మూడు నియమాలు, యానిమేషన్‌తో.'}},
  {href:'sound-experiment.html', icon:'🔊',
    title:{en:'How Sound Travels', te:'ధ్వని ఎలా ప్రయాణిస్తుంది'},
    desc:{en:'A wave of squeezing and stretching air, passed from molecule to molecule.', te:'గాలిని నొక్కుతూ, సాగదీస్తూ అణువు నుండి అణువుకు వెళ్లే ఒక తరంగం.'}},
  {href:'archimedes-experiment.html', icon:'🛁',
    title:{en:"Archimedes' Principle", te:'ఆర్కిమెడీస్ సూత్రం'},
    desc:{en:"Why massive ships float but a tiny coin sinks — it's about displaced water.", te:'భారీ ఓడలు ఎందుకు తేలుతాయో, చిన్న నాణెం ఎందుకు మునిగిపోతుందో — తొలగించిన నీటి గురించే ఇది.'}},
  {href:'heat-vs-temperature-experiment.html', icon:'🌡️',
    title:{en:'Heat vs Temperature', te:'ఉష్ణం vs ఉష్ణోగ్రత'},
    desc:{en:'A cup of tea and a swimming pool can share a temperature but hold wildly different heat.', te:'ఒక కప్పు టీ మరియు ఈత కొలను ఒకే ఉష్ణోగ్రతను కలిగి ఉన్నా, వాటిలో ఉష్ణం చాలా భిన్నంగా ఉంటుంది.'}},
  {href:'electromagnetic-induction-experiment.html', icon:'⚡',
    title:{en:'Electromagnetic Induction', te:'విద్యుదయస్కాంత ప్రేరణ'},
    desc:{en:'Move a magnet near a wire and electricity appears — how generators work.', te:'ఒక తీగ దగ్గర అయస్కాంతాన్ని కదిలిస్తే విద్యుత్ ఉత్పన్నమవుతుంది — జనరేటర్లు ఇలా పనిచేస్తాయి.'}},
  {href:'refraction-experiment.html', icon:'🔍',
    title:{en:'Refraction & Lenses', te:'వక్రీభవనం & కటకాలు'},
    desc:{en:"Light bends in glass — shape it right and you've built a magnifying glass.", te:'గాజులో కాంతి వంగుతుంది — సరైన ఆకారం ఇస్తే భూతద్దం తయారవుతుంది.'}},
  {href:'doppler-experiment.html', icon:'🚨',
    title:{en:'The Doppler Effect', te:'డాప్లర్ ప్రభావం'},
    desc:{en:'Why an ambulance siren sounds higher approaching, lower as it passes.', te:'అంబులెన్స్ సైరన్ దగ్గరవుతున్నప్పుడు ఎక్కువ పిచ్‌లోనూ, దాటిపోయాక తక్కువ పిచ్‌లోనూ ఎందుకు వినిపిస్తుంది.'}},
];

const grid = document.getElementById('grid');

function renderGrid() {
  grid.innerHTML = '';
  TOPICS.forEach(t => {
    const a = document.createElement('a');
    a.className = 'card';
    a.href = t.href;
    a.innerHTML = `<div class="icon">${t.icon}</div><h3>${t.title[LANG]}</h3><p>${t.desc[LANG]}</p><span class="tag">${tr().openExperiment}</span>`;
    grid.appendChild(a);
  });
}

function applyStaticText() {
  const t = tr();
  document.getElementById('navHome').textContent = t.navHome;
  document.getElementById('navPlay').textContent = t.navPlay;
  document.getElementById('navCta').textContent = t.navCta;
  document.getElementById('heroTitle').textContent = t.heroTitle;
  document.getElementById('heroDesc').textContent = t.heroDesc;
  document.getElementById('footerText').textContent = t.footerText;
  document.getElementById('footerBackLink').textContent = t.footerBackLink;
  document.getElementById('langToggle').textContent = LANG === 'en' ? 'తెలుగు' : 'English';
  renderGrid();
}

document.getElementById('langToggle').addEventListener('click', () => {
  LANG = LANG === 'en' ? 'te' : 'en';
  applyStaticText();
});

applyStaticText();
</script>
</body>
</html>
